name: Publish image
# Builds the production image on every push to main and publishes versioned tags
# to GitHub Container Registry. Alternate Clouds refuses moving tags such as
# latest/main, so deploy a vN or sha-xxxxxxx tag.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/reroute" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:v${{ github.run_number }}
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
      - name: Deploy hint
        run: |
          echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.name.outputs.image }}:v${{ github.run_number }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Make the package public once (GitHub → Packages → reroute → Package settings → Change visibility)." >> "$GITHUB_STEP_SUMMARY"

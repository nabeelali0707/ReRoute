name: ReRoute checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.lock
      - run: python -m pytest backend/test_workflow.py -q
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start disposable demo server
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/reroute.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && exit 0
            sleep 1
          done
          cat /tmp/reroute.log
          exit 1
      - run: npx playwright test
        working-directory: frontend
